name: Website CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run claims:check
      - run: npm run build
